[project]
name = "astrbot-plugin-group-chat-plus"
version = "2.1.0"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.8.0", "Pillow>=10.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/multimodal"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
