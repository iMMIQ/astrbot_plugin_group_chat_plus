name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
  astrbot-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: AstrBotDevs/AstrBot
          ref: v4.28.2
          path: framework
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --no-dev
        working-directory: framework
      - name: Offline contract against the real core
        working-directory: framework
        run: uv run --no-sync python ../plugin/tests/multimodal/sdk_probe.py "$GITHUB_WORKSPACE/plugin"
